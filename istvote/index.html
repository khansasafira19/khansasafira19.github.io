<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IST Favorit Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link rel="shortcut icon" href="../infografisfi/images/logobps.png" type="image/x-icon">
    <style>
        body {
            font-family: "Poppins", Helvetica, "sans-serif";
            background: #f9f9f9;
        }

        .candidate-card {
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            transition: transform 0.5s;
        }

        .col-md-5 {
            flex: 0 0 auto;
            width: 20%;
        }

        .candidate-card:hover {
            transform: translateY(-10px);
        }

        .candidate-card img {
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            height: 250px;
            object-fit: cover;
        }

        .vote-btn {
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .vote-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body class="container py-4">

    <h1 class="text-center mb-4">Pemilihan IST Favorit</h1>
    <p class="text-center text-muted">Pilih "Vote" untuk Memilih IST Favoritmu!</p>

    <div id="candidates" class="row"></div>

    <div id="results" class="mt-5">
        <h2 class="text-center">Real-time Dashboard</h2>
        <div id="resultsChart" style="height: 500px;"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzfNjNSmWDZtxeV7FgtOWTe71nnaivvp8Ph5kD-53jXARdKN3IZax38KsVsWFW5GnLz/exec"; // Replace with your Google Apps Script Web App URL

        // List of candidates with photo URLs
        const candidates = [
            { name: "Tommy", photo: "foto_ist/1700.png" },
            { name: "Pasya", photo: "foto_ist/1701.png" },
            { name: "Nani", photo: "foto_ist/1702.png" },
            { name: "Nabilla", photo: "foto_ist/1704.png" },
            { name: "Firman", photo: "foto_ist/1705.png" },
            { name: "Diah", photo: "foto_ist/1706.png" },
            { name: "Azni", photo: "foto_ist/1707.png" },
            { name: "Jhon", photo: "foto_ist/1708.png" },
            { name: "Mey", photo: "foto_ist/1709.jpg" },
            { name: "Ibram", photo: "foto_ist/1771.png" }
        ];

        // Render candidate cards
        const container = document.getElementById("candidates");
        candidates.forEach(c => {
            const div = document.createElement("div");
            div.className = "col-md-5";
            div.innerHTML = `
                <div class="card candidate-card">
                <img src="${c.photo}" alt="${c.name}">
                <div class="card-body text-center">
                    <h5 class="card-title">${c.name}</h5>
                    <button class="vote-btn" onclick="vote('${c.name}')">Vote</button>
                </div>
                </div>`;
            container.appendChild(div);
        });

        // cutoff date (Jakarta time = GMT+7)
        const cutoff = new Date("2025-09-25T10:55:00+07:00");

        // function to check and disable vote buttons
        function checkVotingDeadline() {
            const now = new Date();
            if (now >= cutoff) {
                document.querySelectorAll(".vote-btn").forEach(btn => {
                    btn.disabled = true;
                    btn.innerText = "Voting Closed";
                    btn.classList.add("disabled");
                });
            }
        }

        // run once when page loads
        checkVotingDeadline();

        // optional: keep checking every minute
        setInterval(checkVotingDeadline, 60000);

        async function vote(candidate) {
            const { value: email } = await Swal.fire({
                title: 'Masukkan NIP Anda\n(18 Digits)',
                input: 'text',
                inputPlaceholder: '1991xxxxxxxxxxxxxx',
                inputValidator: (value) => {
                    if (!value) {
                        return 'Mohon isikan NIP';
                    }
                    if (!/^\d+$/.test(value)) {
                        return 'NIP terisi angka saja';
                    }
                    if (value.length < 18) {
                        return 'NIP 18 digit';
                    }
                },
                showCancelButton: true,
                confirmButtonText: 'Vote'
            });

            if (!email) return;

            // 🔹 Show loading alert while sending data
            Swal.fire({
                title: 'Submitting your vote...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            let res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ email, candidate })
            });
            let json = await res.json();

            if (json.status === "success") {
                Swal.fire('Thank you!', json.message, 'success');
            } else {
                Swal.fire('Oops!', json.message, 'error');
            }

            loadResults();
        }

        // Highcharts setup
        let chart;
        async function loadResults() {
            let res = await fetch(API_URL);
            let data = await res.json();
            let labels = candidates.map(c => c.name);
            let values = labels.map(c => data[c] || 0);

            if (!chart) {
                chart = Highcharts.chart('resultsChart', {
                    chart: {
                        type: 'column',
                        style: {
                            fontFamily: 'Poppins, sans-serif' // 🔹 apply globally
                        }
                    },
                    title: {
                        text: 'Live Vote Count',
                        style: { fontFamily: 'Poppins, sans-serif' } // optional override
                    },
                    xAxis: {
                        categories: labels,
                        labels: {
                            style: { fontFamily: 'Poppins, sans-serif' }
                        }
                    },
                    yAxis: {
                        min: 0,
                        title: {
                            text: 'Votes',
                            style: { fontFamily: 'Poppins, sans-serif' }
                        },
                        labels: {
                            style: { fontFamily: 'Poppins, sans-serif' }
                        }
                    },
                    legend: {
                        itemStyle: { fontFamily: 'Poppins, sans-serif' }
                    },
                    tooltip: {
                        style: { fontFamily: 'Poppins, sans-serif' }
                    },
                    series: [{
                        name: 'Votes',
                        data: values,
                        colorByPoint: true
                    }]
                });
            } else {
                chart.series[0].setData(values);
            }

        }

        // auto-refresh every 5s
        setInterval(loadResults, 5000);
        loadResults();
    </script>

</body>

</html>
